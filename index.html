<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Carteirada</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg-void:#0a0e14; --bg-panel:#12171f; --bg-panel-2:#1a212c;
    --steel:#3a4756; --gold:#b08d3e; --gold-bright:#d4af5a;
    --text:#e8ecf1; --text-dim:#8b95a3; --danger:#c0392b; --ok:#3a8f5f;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg-void); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:var(--text); user-select:none; -webkit-user-select:none;
  }
  .app{ position:relative; height:100dvh; z-index:1; }

  /* ---------- TELA DE BLOQUEIO ---------- */
  #lock-screen{
    position:relative; height:100%; width:100%; overflow:hidden;
    background:var(--bg-void);
  }
  .lock-bg{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center;
  }
  .lock-bg-overlay{
    position:absolute; inset:0;
    background:linear-gradient(to top, rgba(5,7,10,0.92) 0%, rgba(5,7,10,0.35) 42%, rgba(5,7,10,0.15) 65%, transparent 100%);
  }

  .reveal-panel{
    position:absolute; left:0; right:0; bottom:0;
    padding:0 22px calc(env(safe-area-inset-bottom, 20px) + 26px);
    display:flex; flex-direction:column; gap:14px; align-items:center;
    transform:translateY(0); opacity:0; pointer-events:none;
    transition:opacity .35s ease, transform .35s ease;
  }
  .reveal-panel.show{ opacity:1; pointer-events:auto; }

  .cpf-field{
    width:100%; max-width:380px; background:rgba(18,23,31,0.82); backdrop-filter:blur(10px);
    border:1px solid var(--steel); border-radius:var(--radius);
    padding:16px 18px; display:flex; flex-direction:column; gap:6px; transition:border-color .2s;
  }
  .cpf-field.error{ border-color:var(--danger); animation:shake .35s; }
  .cpf-field label{ font-size:10px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; }
  .cpf-field input{
    background:none; border:none; outline:none; color:var(--text); font-size:20px;
    letter-spacing:1px; width:100%; font-family:'Courier New',monospace;
  }
  .cpf-field input::placeholder{ color:#5b6572; letter-spacing:0.5px; font-family:-apple-system,sans-serif; font-size:14px; }
  .unlock-btn{
    width:100%; max-width:380px; padding:16px; border-radius:var(--radius); border:none;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold)); color:#1a1305;
    font-size:15px; font-weight:700; letter-spacing:1px; text-transform:uppercase; cursor:pointer;
  }
  .unlock-btn:active{ transform:scale(0.97); }
  .error-msg{ font-size:12px; color:var(--danger); text-align:center; min-height:16px; opacity:0; transition:opacity .2s; }
  .error-msg.show{ opacity:1; }

  /* ---------- SPLASH PCPR ---------- */
  #splash-screen{
    display:none; position:fixed; inset:0; background:var(--bg-void); z-index:9;
    align-items:center; justify-content:center;
  }
  #splash-screen.show{ display:flex; }
  #splash-screen img{
    width:min(55vw, 260px);
    opacity:0;
    transition:opacity 3s ease;
  }
  #splash-screen img.fade-in{ opacity:1; }

  /* ---------- GALERIA (carrossel em tela cheia) ---------- */
  #gallery-screen{
    display:none; height:100%; position:relative; background:#000;
  }
  #gallery-screen.show{ display:block; }

  .frame-stage{
    height:100%; width:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; padding:56px 12px;
  }
  .photo-frame{
    width:min(94vw, 460px);
    height:80vh;
    border-radius:18px;
    overflow:hidden;
    border:1px solid rgba(176,141,62,0.35);
    box-shadow:0 16px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.3);
    background:var(--bg-panel);
    position:relative;
    touch-action:none;
  }
  .photo-frame img{
    width:100%; height:100%; object-fit:contain; display:block;
    transform-origin:center center; will-change:transform;
  }
  .dots{ display:flex; gap:6px; }
  .dots span{
    width:6px; height:6px; border-radius:50%; background:var(--steel);
    transition:background .2s, transform .2s;
  }
  .dots span.active{ background:var(--gold-bright); transform:scale(1.3); }

  .gallery-empty{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; color:var(--text-dim); padding:24px; text-align:center;
  }
  .gallery-empty .icon{ font-size:40px; }
  .gallery-empty p{ font-size:13px; max-width:260px; margin:0; }
  .gallery-empty button{
    padding:12px 22px; border-radius:24px; border:none;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold)); color:#1a1305;
    font-weight:700; font-size:13px;
  }

  .lock-icon-btn{
    position:absolute; top:calc(env(safe-area-inset-top, 14px) + 8px); left:16px;
    width:36px; height:36px; border-radius:50%; background:rgba(10,14,20,0.6); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.1); color:var(--text); font-size:15px;
    display:flex; align-items:center; justify-content:center; z-index:3;
  }

  /* botão flutuante de menu (3 pontinhos) */
  .fab-menu-btn{
    position:absolute; bottom:calc(env(safe-area-inset-bottom, 18px) + 14px); right:18px;
    width:52px; height:52px; border-radius:50%;
    background:rgba(18,23,31,0.85); backdrop-filter:blur(8px);
    border:1px solid rgba(176,141,62,0.35); color:var(--gold-bright);
    font-size:20px; font-weight:900; letter-spacing:1px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.5); z-index:4;
  }
  .fab-menu-btn:active{ transform:scale(0.94); }

  /* bottom sheet */
  #sheet-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:10;
  }
  #sheet-overlay.show{ display:block; }
  #sheet{
    position:absolute; left:0; right:0; bottom:0;
    background:var(--bg-panel); border-radius:20px 20px 0 0;
    padding:10px 14px calc(env(safe-area-inset-bottom, 10px) + 14px);
    transform:translateY(100%); transition:transform .25s ease;
    border-top:1px solid var(--bg-panel-2);
  }
  #sheet-overlay.show #sheet{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; border-radius:2px; background:var(--steel); margin:6px auto 14px; }
  .sheet-item{
    display:flex; align-items:center; gap:12px; padding:14px 8px;
    font-size:14.5px; color:var(--text); border-bottom:1px solid var(--bg-panel-2);
  }
  .sheet-item:last-child{ border-bottom:none; }
  .sheet-item .ic{ width:22px; text-align:center; font-size:16px; }
  .sheet-item.danger{ color:var(--danger); }

  input[type=file]{ display:none; }

  /* ---------- TELA ORGANIZAR ---------- */
  #organize-screen{
    display:none; position:fixed; inset:0; background:var(--bg-void); z-index:8; flex-direction:column;
  }
  #organize-screen.show{ display:flex; }
  .organize-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top, 16px) + 10px) 16px 12px; border-bottom:1px solid var(--bg-panel-2);
  }
  .organize-top .title{ font-size:15px; font-weight:700; }
  .organize-done{
    background:var(--gold); color:#1a1305; border:none; padding:8px 16px; border-radius:20px;
    font-size:12.5px; font-weight:700;
  }
  .organize-list{ flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .organize-row{
    display:flex; align-items:center; gap:12px; background:var(--bg-panel);
    border:1px solid var(--bg-panel-2); border-radius:12px; padding:8px;
  }
  .organize-row img{ width:52px; height:52px; object-fit:cover; border-radius:8px; }
  .organize-row .label{ flex:1; font-size:12px; color:var(--text-dim); }
  .organize-row .arrows{ display:flex; flex-direction:column; gap:4px; }
  .organize-row .arrows button{
    width:32px; height:26px; border-radius:6px; border:1px solid var(--steel);
    background:var(--bg-panel-2); color:var(--text); font-size:12px;
  }
  .organize-row .arrows button:disabled{ opacity:0.3; }
  .organize-row .del-row{
    width:32px; height:32px; border-radius:8px; border:1px solid var(--danger);
    background:transparent; color:var(--danger); font-size:14px;
  }

  /* ---------- TELA GERENCIAR ACESSOS ---------- */
  #access-screen{
    display:none; position:fixed; inset:0; background:var(--bg-void); z-index:8; flex-direction:column;
  }
  #access-screen.show{ display:flex; }
  .access-row{
    display:flex; align-items:center; gap:12px; background:var(--bg-panel);
    border:1px solid var(--bg-panel-2); border-radius:12px; padding:12px;
  }
  .access-row .avatar{
    width:38px; height:38px; border-radius:50%; background:var(--bg-panel-2);
    display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;
  }
  .access-row .info{ flex:1; }
  .access-row .info .name{ font-size:13.5px; font-weight:600; }
  .access-row .info .tag{ font-size:10.5px; color:var(--gold-bright); letter-spacing:0.5px; }
  .access-row .info .date{ font-size:10.5px; color:var(--text-dim); }
  .access-form{
    padding:14px 14px calc(env(safe-area-inset-bottom, 10px) + 16px);
    border-top:1px solid var(--bg-panel-2); display:flex; flex-direction:column; gap:10px;
  }
  .access-input-field{ padding:12px 16px; }
  .access-input-field input{ font-size:16px; letter-spacing:0.5px; }

  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
</style>
</head>
<body>
<div class="app">

  <!-- TELA DE BLOQUEIO -->
  <div id="lock-screen">
    <img id="lock-bg" src="" alt="" class="lock-bg">
    <div class="lock-bg-overlay" id="lock-bg-overlay"></div>

    <div class="reveal-panel" id="reveal-panel">
      <div class="cpf-field" id="cpf-wrap">
        <label for="cpf-input">Matrícula</label>
        <input id="cpf-input" type="password" inputmode="numeric" maxlength="14" placeholder="Digite sua matrícula" autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="error-msg" id="error-msg">Matrícula incorreta. Tente novamente.</div>
      <button class="unlock-btn" id="unlock-btn">Registrar-se</button>
    </div>
  </div>

  <!-- SPLASH PCPR -->
  <div id="splash-screen">
    <img id="splash-img" src="" alt="PCPR">
  </div>

  <!-- GALERIA -->
  <div id="gallery-screen">
    <button class="lock-icon-btn" id="lock-again-btn">🔒</button>
    <div class="frame-stage" id="frame-stage">
      <div class="photo-frame" id="photo-frame"></div>
      <div class="dots" id="dots"></div>
    </div>
    <button class="fab-menu-btn" id="fab-btn">⋮</button>
  </div>

  <!-- MENU (bottom sheet) -->
  <div id="sheet-overlay">
    <div id="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-item" id="add-item"><span class="ic">＋</span> Adicionar foto</div>
      <div class="sheet-item" id="organize-item"><span class="ic">☰</span> Organizar fotos</div>
      <div class="sheet-item" id="access-item" style="display:none;"><span class="ic">👤</span> Gerenciar acessos</div>
      <div class="sheet-item danger" id="delete-item"><span class="ic">✕</span> Apagar esta foto</div>
    </div>
  </div>
  <input type="file" id="file-input" accept="image/*" multiple>

  <!-- ORGANIZAR -->
  <div id="organize-screen">
    <div class="organize-top">
      <div class="title">Organizar fotos</div>
      <button class="organize-done" id="organize-done">Concluir</button>
    </div>
    <div class="organize-list" id="organize-list"></div>
  </div>

  <!-- GERENCIAR ACESSOS -->
  <div id="access-screen">
    <div class="organize-top">
      <div class="title">Gerenciar acessos</div>
      <button class="organize-done" id="access-done">Concluir</button>
    </div>
    <div class="organize-list" id="access-list"></div>
    <div class="access-form">
      <div class="cpf-field access-input-field">
        <label for="access-label-input">Nome (opcional)</label>
        <input id="access-label-input" type="text" placeholder="Ex: Esposa, Fulano..." autocomplete="off">
      </div>
      <div class="cpf-field access-input-field">
        <label for="access-cpf-input">CPF / Matrícula</label>
        <input id="access-cpf-input" type="tel" inputmode="numeric" maxlength="11" placeholder="Somente números" autocomplete="off">
      </div>
      <div class="error-msg" id="access-error">Digite um número válido (11 dígitos).</div>
      <button class="unlock-btn" id="access-add-btn">Adicionar acesso</button>
    </div>
  </div>

</div>

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

/* ---------- IndexedDB ---------- */
const DB_NAME = "carteirada-db";
const STORE = "fotos";
const CRED_STORE = "credenciais";
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 2);
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains(STORE)) {
        database.createObjectStore(STORE, { keyPath: "id", autoIncrement: true });
      }
      if (!database.objectStoreNames.contains(CRED_STORE)) {
        database.createObjectStore(CRED_STORE, { keyPath: "id", autoIncrement: true });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e);
  });
}
async function addFoto(dataUrl, ordem) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).add({ dataUrl, ordem, ownerHash: currentUserHash, criadoEm: Date.now() });
    tx.oncomplete = resolve; tx.onerror = reject;
  });
}
async function getFotos() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => {
      const doUsuario = req.result.filter(f => f.ownerHash === currentUserHash);
      resolve(doUsuario.sort((a,b) => (a.ordem ?? a.criadoEm) - (b.ordem ?? b.criadoEm)));
    };
    req.onerror = reject;
  });
}
async function updateOrdem(id, ordem) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    const store = tx.objectStore(STORE);
    const getReq = store.get(id);
    getReq.onsuccess = () => {
      const rec = getReq.result;
      rec.ordem = ordem;
      store.put(rec);
    };
    tx.oncomplete = resolve; tx.onerror = reject;
  });
}
async function deleteFoto(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = resolve; tx.onerror = reject;
  });
}

/* ---------- credenciais (CPF/matrícula autorizados) ---------- */
async function addCredencial(hash, label, isAdmin) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(CRED_STORE, "readwrite");
    tx.objectStore(CRED_STORE).add({ hash, label: label || "", isAdmin: !!isAdmin, criadoEm: Date.now() });
    tx.oncomplete = resolve; tx.onerror = reject;
  });
}
async function getCredenciais() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(CRED_STORE, "readonly");
    const req = tx.objectStore(CRED_STORE).getAll();
    req.onsuccess = () => resolve(req.result.sort((a,b) => a.criadoEm - b.criadoEm));
    req.onerror = reject;
  });
}
async function deleteCredencial(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(CRED_STORE, "readwrite");
    tx.objectStore(CRED_STORE).delete(id);
    tx.oncomplete = resolve; tx.onerror = reject;
  });
}
async function garantirCredencialInicial() {
  const existentes = await getCredenciais();
  if (existentes.length === 0) {
    await addCredencial(CPF_HASH, "Titular", true);
  }
}

async function migrarFotosAntigas() {
  // fotos criadas antes do isolamento por usuário não tinham "ownerHash";
  // aqui elas são atribuídas ao Titular, para não ficarem visíveis a outros acessos.
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    const store = tx.objectStore(STORE);
    const req = store.openCursor();
    req.onsuccess = (e) => {
      const cursor = e.target.result;
      if (cursor) {
        if (!cursor.value.ownerHash) {
          const rec = cursor.value;
          rec.ownerHash = CPF_HASH;
          cursor.update(rec);
        }
        cursor.continue();
      }
    };
    tx.oncomplete = resolve; tx.onerror = reject;
  });
}

});
async function tryUnlock() {
  const digits = cpfInput.value.replace(/\D/g, "");
  if (digits.length !== 11) { showError(); return; }
  const hash = await sha256Hex(digits);
  const credenciais = await getCredenciais();
  const encontrada = credenciais.find(c => c.hash === hash);
  if (encontrada) {
    currentIsAdmin = !!encontrada.isAdmin;
    currentUserHash = hash;
    accessItem.style.display = currentIsAdmin ? "flex" : "none";
    lockScreen.style.display = "none";
    cpfInput.value = "";
    revealPanel.classList.remove("show");
    await showSplashThenGallery();
  } else { showError(); }
}

async function showSplashThenGallery() {
  splashImg.src = `data:image/png;base64,${PCPR_BADGE_B64}`;
  splashScreen.classList.add("show");
  // força reflow antes de aplicar a classe de transição, garantindo que o fade rode
  splashImg.getBoundingClientRect();
  requestAnimationFrame(() => splashImg.classList.add("fade-in"));

  await new Promise((res) => setTimeout(res, 3000));

  galleryScreen.classList.add("show");
  await renderGallery();

  splashScreen.classList.remove("show");
  splashImg.classList.remove("fade-in");
}
function showError() {
  cpfWrap.classList.add("error");
  errorMsg.classList.add("show");
  navigator.vibrate && navigator.vibrate(120);
}
unlockBtn.addEventListener("click", tryUnlock);
cpfInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });
lockAgainBtn.addEventListener("click", () => {
  galleryScreen.classList.remove("show");
  lockScreen.style.display = "flex";
});

/* ---------- galeria / moldura com toque ---------- */
async function renderGallery(showIndex) {
  fotosCache = await getFotos();
  currentIndex = showIndex ?? 0;
  if (currentIndex >= fotosCache.length) currentIndex = fotosCache.length - 1;
  if (currentIndex < 0) currentIndex = 0;
  drawFrame();
}

function drawFrame() {
  zoomScale = 1; panX = 0; panY = 0;
  if (fotosCache.length === 0) {
    photoFrame.innerHTML = `
      <div class="gallery-empty">
        <div class="icon">📂</div>
        <p>Nenhuma foto ainda. Toque no botão ⋮ no canto para adicionar a primeira.</p>
      </div>`;
    dotsWrap.innerHTML = "";
    return;
  }
  const foto = fotosCache[currentIndex];
  photoFrame.innerHTML = `<img src="${foto.dataUrl}" alt="Foto">`;

  dotsWrap.innerHTML = "";
  fotosCache.forEach((_, i) => {
    const dot = document.createElement("span");
    if (i === currentIndex) dot.classList.add("active");
    dotsWrap.appendChild(dot);
  });
}

/* ---------- zoom (pinça com dois dedos + duplo toque) ---------- */
let zoomScale = 1, panX = 0, panY = 0;
let isPinching = false, pinchStartDist = 0, pinchStartScale = 1;
let isPanning = false, panOriginX = 0, panOriginY = 0;
let touchStartX = 0, touchStartY = 0, moved = false;
let lastTapTime = 0, tapTimeout = null;

function getDistance(t1, t2) {
  const dx = t1.clientX - t2.clientX;
  const dy = t1.clientY - t2.clientY;
  return Math.sqrt(dx * dx + dy * dy);
}
function applyZoomTransform() {
  const img = photoFrame.querySelector("img");
  if (img) img.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
}
function clampPan() {
  const maxPanX = (photoFrame.clientWidth * (zoomScale - 1)) / 2;
  const maxPanY = (photoFrame.clientHeight * (zoomScale - 1)) / 2;
  panX = Math.min(maxPanX, Math.max(-maxPanX, panX));
  panY = Math.min(maxPanY, Math.max(-maxPanY, panY));
}
function toggleZoom(clientX, clientY) {
  if (zoomScale > 1) {
    zoomScale = 1; panX = 0; panY = 0;
  } else {
    zoomScale = 2.2;
    const rect = photoFrame.getBoundingClientRect();
    const offsetX = clientX - rect.left - rect.width / 2;
    const offsetY = clientY - rect.top - rect.height / 2;
    panX = -offsetX * (zoomScale - 1) / zoomScale;
    panY = -offsetY * (zoomScale - 1) / zoomScale;
    clampPan();
  }
  applyZoomTransform();
}
function advancePhoto() {
  if (fotosCache.length <= 1) return;
  currentIndex = (currentIndex + 1) % fotosCache.length;
  drawFrame();
}

photoFrame.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    isPinching = true;
    pinchStartDist = getDistance(e.touches[0], e.touches[1]);
    pinchStartScale = zoomScale;
  } else if (e.touches.length === 1) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    moved = false;
    if (zoomScale > 1) {
      isPanning = true;
      panOriginX = panX; panOriginY = panY;
    }
  }
}, { passive: true });

photoFrame.addEventListener("touchmove", (e) => {
  if (isPinching && e.touches.length === 2) {
    e.preventDefault();
    const dist = getDistance(e.touches[0], e.touches[1]);
    zoomScale = Math.min(4, Math.max(1, pinchStartScale * (dist / pinchStartDist)));
    clampPan();
    applyZoomTransform();
  } else if (isPanning && e.touches.length === 1) {
    e.preventDefault();
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
    panX = panOriginX + dx;
    panY = panOriginY + dy;
    clampPan();
    applyZoomTransform();
  } else if (e.touches.length === 1) {
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
  }
}, { passive: false });

photoFrame.addEventListener("touchend", () => {
  if (isPinching) {
    isPinching = false;
    if (zoomScale <= 1.02) { zoomScale = 1; panX = 0; panY = 0; applyZoomTransform(); }
    return;
  }
  if (isPanning) { isPanning = false; return; }
  if (fotosCache.length === 0 || moved) return;

  const now = Date.now();
  if (now - lastTapTime < 300) {
    clearTimeout(tapTimeout);
    lastTapTime = 0;
    toggleZoom(touchStartX, touchStartY);
  } else {
    lastTapTime = now;
    tapTimeout = setTimeout(() => {
      if (zoomScale <= 1) advancePhoto();
      lastTapTime = 0;
    }, 300);
  }
});

/* ---------- menu flutuante ---------- */
fabBtn.addEventListener("click", () => sheetOverlay.classList.add("show"));
sheetOverlay.addEventListener("click", (e) => { if (e.target === sheetOverlay) sheetOverlay.classList.remove("show"); });

const addItem = document.getElementById("add-item");
addItem.addEventListener("click", () => {
  sheetOverlay.classList.remove("show");
  fileInput.click();
});

fileInput.addEventListener("change", async (e) => {
  const files = Array.from(e.target.files || []);
  if (files.length === 0) return;
  try {
    if (!db) db = await openDB();
    let maxOrdem = fotosCache.length ? Math.max(...fotosCache.map(f => f.ordem ?? 0)) : 0;
    for (const file of files) {
      const dataUrl = await new Promise((res, rej) => {
        const reader = new FileReader();
        reader.onload = (ev) => res(ev.target.result);
        reader.onerror = rej;
        reader.readAsDataURL(file);
      });
      maxOrdem += 1;
      await addFoto(dataUrl, maxOrdem);
    }
    await renderGallery(fotosCache.length + files.length - 1);
  } catch (err) {
    alert("Não foi possível salvar a foto neste aparelho. Tente abrir o arquivo direto pelo Chrome (não pelo Gerenciador de Arquivos). Detalhe: " + err);
  } finally {
    fileInput.value = "";
  }
});

deleteItem.addEventListener("click", async () => {
  sheetOverlay.classList.remove("show");
  if (fotosCache.length === 0) return;
  const foto = fotosCache[currentIndex];
  if (!foto) return;
  if (confirm("Apagar esta foto?")) {
    await deleteFoto(foto.id);
    const novoIndex = Math.max(0, currentIndex - 1);
    await renderGallery(novoIndex);
  }
});

/* ---------- organizar ---------- */
organizeItem.addEventListener("click", async () => {
  sheetOverlay.classList.remove("show");
  await renderOrganizeList();
  organizeScreen.classList.add("show");
});
organizeDone.addEventListener("click", async () => {
  organizeScreen.classList.remove("show");
  await renderGallery(0);
});

/* ---------- gerenciar acessos (somente titular) ---------- */
accessItem.addEventListener("click", async () => {
  sheetOverlay.classList.remove("show");
  if (!currentIsAdmin) return;
  await renderAccessList();
  accessScreen.classList.add("show");
});
accessDone.addEventListener("click", () => {
  accessScreen.classList.remove("show");
  accessLabelInput.value = "";
  accessCpfInput.value = "";
  accessError.classList.remove("show");
});

async function renderAccessList() {
  const credenciais = await getCredenciais();
  accessList.innerHTML = "";
  credenciais.forEach((cred) => {
    const row = document.createElement("div");
    row.className = "access-row";
    const data = new Date(cred.criadoEm).toLocaleDateString("pt-BR");
    row.innerHTML = `
      <div class="avatar">👤</div>
      <div class="info">
        <div class="name">${cred.label || "Sem nome"}</div>
        ${cred.isAdmin ? '<div class="tag">TITULAR</div>' : `<div class="date">adicionado em ${data}</div>`}
      </div>
      ${cred.isAdmin ? "" : '<button class="del-row">✕</button>'}
    `;
    if (!cred.isAdmin) {
      row.querySelector(".del-row").addEventListener("click", async () => {
        if (confirm(`Remover o acesso de "${cred.label || "este número"}"?`)) {
          await deleteCredencial(cred.id);
          await renderAccessList();
        }
      });
    }
    accessList.appendChild(row);
  });
}

accessCpfInput.addEventListener("input", (e) => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 11);
  accessError.classList.remove("show");
});

accessAddBtn.addEventListener("click", async () => {
  const digits = accessCpfInput.value.replace(/\D/g, "");
  if (digits.length !== 11) {
    accessError.textContent = "Digite um número válido (11 dígitos).";
    accessError.classList.add("show");
    return;
  }
  const hash = await sha256Hex(digits);
  const credenciais = await getCredenciais();
  if (credenciais.some(c => c.hash === hash)) {
    accessError.textContent = "Esse número já tem acesso.";
    accessError.classList.add("show");
    return;
  }
  await addCredencial(hash, accessLabelInput.value.trim(), false);
  accessLabelInput.value = "";
  accessCpfInput.value = "";
  accessError.classList.remove("show");
  await renderAccessList();
});

async function renderOrganizeList() {
  fotosCache = await getFotos();
  organizeList.innerHTML = "";
  fotosCache.forEach((foto, i) => {
    const row = document.createElement("div");
    row.className = "organize-row";
    row.innerHTML = `
      <img src="${foto.dataUrl}" alt="">
      <div class="label">Foto ${i + 1}</div>
      <div class="arrows">
        <button data-dir="up" ${i === 0 ? "disabled" : ""}>▲</button>
        <button data-dir="down" ${i === fotosCache.length - 1 ? "disabled" : ""}>▼</button>
      </div>
      <button class="del-row">✕</button>
    `;
    row.querySelector('[data-dir="up"]').addEventListener("click", () => moveFoto(i, -1));
    row.querySelector('[data-dir="down"]').addEventListener("click", () => moveFoto(i, 1));
    row.querySelector(".del-row").addEventListener("click", async () => {
      if (confirm("Apagar esta foto?")) {
        await deleteFoto(foto.id);
        await renderOrganizeList();
      }
    });
    organizeList.appendChild(row);
  });
}

async function moveFoto(index, dir) {
  const target = index + dir;
  if (target < 0 || target >= fotosCache.length) return;
  const a = fotosCache[index];
  const b = fotosCache[target];
  const ordemA = a.ordem ?? index;
  const ordemB = b.ordem ?? target;
  await updateOrdem(a.id, ordemB);
  await updateOrdem(b.id, ordemA);
  await renderOrganizeList();
}

/* init */
lockBg.src = `data:image/png;base64,${IDAUTH_BG_B64}`;

(async () => {
  try {
    db = await openDB();
    await garantirCredencialInicial();
    await migrarFotosAntigas();
  }
  catch (err) {
    alert("Não foi possível acessar o armazenamento local. Abra este arquivo pelo Chrome (não pelo Gerenciador de Arquivos).");
  }
})();

window.addEventListener("load", () => {
  if (window.matchMedia("(display-mode: standalone)").matches ||
      window.matchMedia("(display-mode: fullscreen)").matches) {
    document.documentElement.requestFullscreen?.().catch(() => {});
  }
});
</script>
